buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "io.openliberty.tools:liberty-gradle-plugin:${libertyGradlePluginVersion}"
    }
}

apply plugin: 'ear'
apply plugin: 'java'
apply plugin: 'eclipse-wtp'
apply plugin: 'maven-publish'

// Use the Liberty Gradle plugin to run our functional tests on Open Liberty
apply plugin: 'liberty'

ear {
   manifest {
      attributes 'Implementation-Title': 'DayTrader 3'
   }
   archiveFileName = 'daytrader3-ee6.ear'
}

configurations {
    derbyLib
}

task copyDerbyLib(type: Copy) {
    into "../daytrader3-ee6-wlpcfg/shared/resources/Daytrader3_SampleDerbyLibs"
    from configurations.derbyLib
}

/* publishing {
    publications {
        mavenWar(MavenPublication) {
            version '1.0-SNAPSHOT'
            groupId 'net.wasdev.wlp.sample'
            artifactId 'daytrader3-ee6'

            from components.web
        }
    }
} */

// Add a functional test task that runs during the 'check' phase that uses the Liberty Gradle plugin
// to launch Open Liberty and run the test classes in the fvt source set
task fvt(type: Test, dependsOn: 'deploy') {
    group 'Verification'
    description 'Runs the functional verification tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    reports.html.outputLocation = file("$buildDir/reports/fvt")
    reports.junitXml.outputLocation = file("$buildDir/test-results/fvt")
    include '**/fvt/**'
    exclude '**/unit/**'
    systemProperties = ['liberty.test.port': getHttpPort()]
    dependsOn 'libertyStart'
    finalizedBy 'libertyStop'
    // If libertyRoot is not set, the Open Liberty kernel is downloaded and the server.xml features installed
}

test {
	reports.html.outputLocation = file("$buildDir/reports/unit")
	reports.junitXml.outputLocation = file("$buildDir/test-results/unit")
	include '**/unit/**'
	exclude '**/fvt/**'
}

repositories { mavenCentral(); }
dependencies {
   deploy project (path: ':daytrader3-ee6-ejb', configuration: 'archives')
   deploy project (path: ':daytrader3-ee6-web', configuration: 'archives')
   deploy project (path: ':daytrader3-ee6-rest', configuration: 'archives')
   derbyLib group: 'org.apache.derby', name: 'derby', version: '10.10.1.1'
   libertyRuntime group: 'io.openliberty', name: 'openliberty-kernel', version: openLibertyVersion
}
String getHttpPort() {
    def DEFAULT_HTTP_PORT = 9083
    def serverXmlFile = file(new File('../daytrader3-ee6-wlpcfg/servers/daytrader3_Sample/server.xml'))
    def portPattern = ~/.*httpPort="(\d+)".*/
    serverXmlFile.eachLine { line ->
        def portMatcher = line =~ portPattern
        if (portMatcher) {
            return portMatcher.group(1)
        }
    }
    return DEFAULT_HTTP_PORT
}

liberty {
    if (project.hasProperty('libertyRoot')) {
        installDir = libertyRoot
    }
    userDir = rootProject.getProjectDir().getAbsolutePath()+'/daytrader3-ee6-wlpcfg'
    server {
        name = 'daytrader3_Sample'
        looseApplication = false
        deploy {
            apps = [ear]
        }
        verifyAppStartTimeout = 120
    }
}

deploy.dependsOn 'ear', 'copyDerbyLib'
// The wlpcfg clean task deletes the deployed ear and Derby libs, so run it first
[deploy, copyDerbyLib, libertyStart].each { it.mustRunAfter ':daytrader3-ee6-wlpcfg:clean' }
libertyStart.mustRunAfter 'deploy'

if (!hasProperty('libertyRoot')) {
    fvt.dependsOn('installFeature')
}

assemble.dependsOn 'deploy','copyDerbyLib'

// Run FVT by default
check.dependsOn 'fvt'
// do not create server since the usr directory is prebuilt.
libertyCreate.enabled = false
