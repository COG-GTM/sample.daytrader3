# DayTrader3 Spring Boot (trade-services slice) configuration
spring.application.name=daytrader3-springboot

# Embedded H2 datasource (in-memory) replacing the EE container-managed datasource
spring.datasource.url=jdbc:h2:mem:tradedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# Schema is created from schema.sql (legacy daytrader.sql) rather than generated by
# Hibernate, preserving the original table shape (non-unique HOLDING_HOLDINGID, no FKs).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.ibm.websphere.samples.daytrader=INFO
