apply plugin: 'java'
apply plugin: 'eclipse-wtp'

jar {
    archiveBaseName = 'dt-ejb'
}


// Dependencies
repositories { mavenCentral(); }

dependencies {
    compileOnly group: 'org.hibernate.javax.persistence', name: 'hibernate-jpa-2.0-api', version: '1.0.1.Final'
    compileOnly group: 'javax.ejb', name: 'ejb-api', version: '3.0'
    compileOnly group: 'javax.jms', name: 'jms-api', version: '1.1-rev-1'
    compileOnly group: 'javax.transaction', name: 'jta', version: '1.1'
    compileOnly group: 'javax.annotation', name: 'javax.annotation-api', version: '1.2'
}
